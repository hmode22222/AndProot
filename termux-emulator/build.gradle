plugins {
    id 'com.android.library'
}

android {
    namespace 'com.termux.terminal'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        minSdk 21
        targetSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
